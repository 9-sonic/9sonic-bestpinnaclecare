                      type: string
                    read_count:
                      type: integer
                    recipient_count:
                      type: integer
                    created_at:
                      type: string
    post:
      summary: Send a message (idempotent on client_message_id)
      tags:
      - Chat
      security:
      - bearerAuth: []
      description: A replay with the same client_message_id returns the original message,
        never a duplicate.
      parameters: []
      responses:
        '201':
          description: sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  conversation_id:
                    type: integer
                  body:
                    type: string
                  client_message_id:
                    type: string
                  created_at:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                client_message_id:
                  type: string
                  format: uuid
