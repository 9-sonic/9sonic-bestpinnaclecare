---
openapi: 3.0.1
info:
  title: Best Pinnacle Care API
  version: v1
  description: |
    Phase 1 API. Two separate identities with separate logins:
    **Admin** (office) and **Employee** (carer PWA).

    Auth is JWT (bearer). Log in at the identity-specific endpoint to get an
    `access` token, then send `Authorization: Bearer <token>`. Admins may have
    TOTP MFA (two-step login); carers can log in with a passkey (WebAuthn).
servers:
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: invalid_credentials
        details:
          type: object
          nullable: true
      required:
      - error
    Admin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: boss@bestpinnacle.test
        first_name:
          type: string
          example: Reg
        last_name:
          type: string
          example: Manager
        full_name:
          type: string
          example: Reg Manager
        role:
          type: string
          enum:
          - registered_manager
          - manager
          - coordinator
          - finance
          - auditor
        active:
          type: boolean
          example: true
        mfa_enabled:
          type: boolean
          example: true
    Employee:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: carer@bestpinnacle.test
        first_name:
          type: string
          example: Cara
        last_name:
          type: string
          example: Erikson
        full_name:
          type: string
          example: Cara Erikson
        role:
          type: string
          enum:
          - carer
          - senior_carer
        employee_reference:
          type: string
          nullable: true
        active:
          type: boolean
          example: true
        mfa_enabled:
          type: boolean
          example: false
    ServiceUser:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        reference:
          type: string
          nullable: true
        address_line1:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        geofence_radius_m:
          type: integer
        geofence_mode:
          type: string
          nullable: true
        access_notes:
          type: string
          nullable: true
        active:
          type: boolean
    Visit:
      type: object
      properties:
        id:
          type: integer
        service_user_id:
          type: integer
        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
        staff_required:
          type: integer
        published_at:
          type: string
          nullable: true
    VisitAssignment:
      type: object
      properties:
        id:
          type: integer
        visit_id:
          type: integer
        employee_id:
          type: integer
        lifecycle_state:
          type: string
          enum:
          - scheduled
          - check_in_window
          - grace_period
          - late
          - in_progress
          - overdue
          - pending_review
          - completed
          - missed
          - cancelled
        assignment_status:
          type: string
        worked_minutes:
          type: integer
          nullable: true
        flags:
          type: array
          items:
            type: string
        visit:
          "$ref": "#/components/schemas/Visit"
paths:
  "/api/v1/admin/auth/login":
    post:
      summary: Admin login
      tags:
      - Auth — Admin
      description: Authenticates against the admins table only. Returns an access
        token, or an MFA challenge (mfa_required + mfa_token) when the admin has MFA
        enabled.
      parameters: []
      responses:
        '200':
          description: authenticated (or MFA challenge)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    nullable: true
                  admin:
                    "$ref": "#/components/schemas/Admin"
                  mfa_required:
                    type: boolean
                    nullable: true
                  mfa_token:
                    type: string
                    nullable: true
                  mfa_setup_required:
                    type: boolean
                    nullable: true
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: boss@bestpinnacle.test
                password:
                  type: string
                  example: secret12
              required:
              - email
              - password
  "/api/v1/staff/auth/login":
    post:
      summary: Carer login
      tags:
      - Auth — Staff
      description: Authenticates against the employees table only.
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  employee:
                    "$ref": "#/components/schemas/Employee"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/mfa":
    post:
      summary: Complete MFA (two-step login)
      tags:
      - Auth
      description: Exchanges the mfa_token from login + a TOTP or backup code for
        an access token.
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  admin:
                    "$ref": "#/components/schemas/Admin"
        '401':
          description: invalid or expired code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token:
                  type: string
                otp_code:
                  type: string
                  example: '123456'
              required:
              - mfa_token
              - otp_code
  "/api/v1/auth/logout":
    delete:
      summary: Log out (revoke token)
      tags:
      - Auth
      security:
      - bearerAuth: []
      description: Denylists the presented bearer token.
      responses:
        '204':
          description: logged out
  "/api/v1/admin/me":
    get:
      summary: Current admin
      tags:
      - Auth — Admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: the signed-in admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Admin"
        '401':
          description: missing/invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/staff/me":
    get:
      summary: Current carer (private fields + pay)
      tags:
      - Carer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
    patch:
      summary: Edit own profile
      tags:
      - Carer
      security:
      - bearerAuth: []
      description: Name, phone and emergency contact. Email + employee_reference stay
        office-controlled.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                emergency_contact_name:
                  type: string
                emergency_contact_phone:
                  type: string
  "/api/v1/admin/mfa":
    post:
      summary: Begin TOTP enrolment
      tags:
      - MFA
      security:
      - bearerAuth: []
      description: Generates a TOTP secret and returns the otpauth:// URI + a QR (inline
        SVG). Not active until confirmed.
      responses:
        '200':
          description: enrolment data
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauth_uri:
                    type: string
                    example: otpauth://totp/Best%20Pinnacle%20Care:boss@bpc.test?secret=...
                  qr_svg:
                    type: string
                    description: Inline SVG of the QR code
  "/api/v1/admin/mfa/confirm":
    post:
      summary: Confirm TOTP enrolment
      tags:
      - MFA
      security:
      - bearerAuth: []
      description: Verifies the first code, activates MFA, and returns one-time backup
        codes (shown once).
      parameters: []
      responses:
        '200':
          description: MFA activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_enabled:
                    type: boolean
                  backup_codes:
                    type: array
                    items:
                      type: string
        '422':
          description: invalid code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_code:
                  type: string
              required:
              - otp_code
  "/api/v1/admin/service_users":
    get:
      summary: List service users
      tags:
      - Office — Service Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ServiceUser"
    post:
      summary: Create a service user
      tags:
      - Office — Service Users
      security:
      - bearerAuth: []
      description: Address is geocoded to lat/lng unless coordinates are supplied.
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceUser"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                address_line1:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                geofence_radius_m:
                  type: integer
                access_notes:
                  type: string
              required:
              - first_name
              - last_name
  "/api/v1/admin/service_users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a service user
      tags:
      - Office — Service Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: service user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceUser"
    patch:
      summary: Update a service user
      tags:
      - Office — Service Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceUser"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                access_notes:
                  type: string
  "/api/v1/admin/service_users/{service_user_id}/care_plan_items":
    parameters:
    - name: service_user_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List care plan items
      tags:
      - Office — Care Plan
      security:
      - bearerAuth: []
      responses:
        '200':
          description: items
    post:
      summary: Add a care plan item
      tags:
      - Office — Care Plan
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                label:
                  type: string
                detail:
                  type: string
                position:
                  type: integer
              required:
              - category
              - label
  "/api/v1/admin/care_package_slots":
    post:
      summary: Create a recurring call
      tags:
      - Office — Care Packages
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_user_id:
                  type: integer
                name:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                recurrence:
                  type: string
                  description: daily, or day list e.g. mon,wed,fri
                staff_required:
                  type: integer
                effective_from:
                  type: string
                  format: date
              required:
              - service_user_id
              - name
              - start_time
              - end_time
              - recurrence
              - effective_from
  "/api/v1/admin/visits":
    get:
      summary: Rota (visits in a window)
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: visits
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Visit"
    post:
      summary: Create an ad-hoc visit
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Visit"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_user_id:
                  type: integer
                scheduled_start:
                  type: string
                  format: date-time
                scheduled_end:
                  type: string
                  format: date-time
              required:
              - service_user_id
              - scheduled_start
              - scheduled_end
  "/api/v1/admin/visits/generate":
    post:
      summary: Generate dated visits from care packages
      tags:
      - Rota
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: visits created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
              required:
              - from
              - to
  "/api/v1/admin/visits/{id}/publish":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Publish a visit
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      responses:
        '200':
          description: published
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Visit"
  "/api/v1/admin/visit_assignments":
    post:
      summary: Assign a carer to a visit
      tags:
      - Rota
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: assigned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VisitAssignment"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visit_id:
                  type: integer
                employee_id:
                  type: integer
              required:
              - visit_id
              - employee_id
  "/api/v1/admin/rota_copies":
    post:
      summary: Copy a week of visits to another week
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: copied count
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_week_start:
                  type: string
                  format: date
                to_week_start:
                  type: string
                  format: date
              required:
              - from_week_start
              - to_week_start
  "/api/v1/admin/dashboard":
    get:
      summary: Dashboard headline counts
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      responses:
        '200':
          description: counts
  "/api/v1/admin/live_board":
    get:
      summary: Live board — today's visits + states
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      responses:
        '200':
          description: board
  "/api/v1/admin/exceptions":
    get:
      summary: Exceptions queue (pending review + open alerts)
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      responses:
        '200':
          description: queue
  "/api/v1/admin/alerts":
    get:
      summary: Open alerts
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      responses:
        '200':
          description: alerts
  "/api/v1/admin/clock_corrections":
    post:
      summary: Manual clock correction (append-only, reason required)
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: recorded
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visit_assignment_id:
                  type: integer
                kind:
                  type: string
                occurred_at:
                  type: string
                reason:
                  type: string
                corrects_id:
                  type: integer
              required:
              - visit_assignment_id
              - kind
              - occurred_at
              - reason
  "/api/v1/admin/timesheet_periods":
    post:
      summary: Build/refresh an attendance period
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: period + lines
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_on:
                  type: string
                  format: date
              required:
              - starts_on
  "/api/v1/admin/employees":
    post:
      summary: Invite a carer
      tags:
      - Office — People
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: invited
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  enum:
                  - carer
                  - senior_carer
              required:
              - email
              - first_name
              - last_name
  "/api/v1/admin/settings":
    get:
      summary: Read provider settings
      tags:
      - Office — Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: settings
    patch:
      summary: Update provider settings
      tags:
      - Office — Settings
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                geofence_radius_m:
                  type: integer
                missed_threshold_minutes:
                  type: integer
  "/api/v1/admin/auth/password":
    post:
      summary: Request a password reset
      tags:
      - Auth — Admin
      description: Always returns 202 (no account enumeration). Emails a tokened reset
        link if the account exists. The same endpoints exist under /api/v1/staff/auth/password.
      parameters: []
      responses:
        '202':
          description: reset requested
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
    put:
      summary: Set a new password
      tags:
      - Auth — Admin
      description: Applies a new password using the token from the reset email.
      parameters: []
      responses:
        '204':
          description: password changed
        '422':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
  "/api/v1/auth/refresh":
    post:
      summary: Rotate a refresh token
      tags:
      - Auth
      description: Exchanges a refresh token for a fresh access token + a new refresh
        token (the old one is revoked). Reusing a revoked token nukes the chain.
      parameters: []
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  access_expires_at:
                    type: string
                  refresh_token:
                    type: string
                  employee:
                    "$ref": "#/components/schemas/Employee"
        '401':
          description: invalid/expired
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/staff/availability":
    get:
      summary: Read availability
      tags:
      - Carer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: weekly pattern
    put:
      summary: Replace availability
      tags:
      - Carer
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: saved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      weekday:
                        type: integer
                      slot:
                        type: string
                        enum:
                        - morning
                        - afternoon
                        - evening
                        - night
                      available:
                        type: boolean
  "/api/v1/staff/visit_assignments/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Visit detail (care plan + tasks + notes)
      tags:
      - Carer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: detail
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/VisitAssignment"
                - type: object
                  properties:
                    care_plan:
                      type: array
                      items:
                        type: object
                    tasks:
                      type: array
                      items:
                        type: object
                    notes:
                      type: array
                      items:
                        type: object
  "/api/v1/staff/mileage":
    post:
      summary: Claim mileage
      tags:
      - Carer
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: claimed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visit_assignment_id:
                  type: integer
                travel_date:
                  type: string
                  format: date
                miles:
                  type: number
                from_label:
                  type: string
                to_label:
                  type: string
              required:
              - travel_date
              - miles
  "/api/v1/staff/summary":
    get:
      summary: Home/Overview totals
      tags:
      - Carer
      security:
      - bearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  hours_worked_minutes:
                    type: integer
                  contracted_minutes:
                    type: integer
                  visits_count:
                    type: integer
                  clients_count:
                    type: integer
                  miles:
                    type: number
                  by_weekday:
                    type: object
  "/api/v1/staff/devices":
    post:
      summary: Register this device (web push)
      tags:
      - Carer
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: registered
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprint:
                  type: string
                  format: uuid
                platform:
                  type: string
                app_version:
                  type: string
                push_subscription:
                  type: object
              required:
              - fingerprint
  "/api/v1/notifications/seen_all":
    post:
      summary: Mark all notifications read
      tags:
      - Notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          description: count updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
  "/api/v1/conversations":
    get:
      summary: List conversations (names + unread + preview)
      tags:
      - Chat
      security:
      - bearerAuth: []
      responses:
        '200':
          description: conversations
  "/api/v1/staff/visit_assignments/{visit_assignment_id}/clock":
    parameters:
    - name: visit_assignment_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Clock in/out of a visit (geofenced)
      tags:
      - Clocking
      security:
      - bearerAuth: []
      description: Live clock-in/out at the service user's home. Within 150 m -> pass;
        outside -> 422 too_far; no GPS -> allowed + flagged. Idempotent on client_event_id.
      parameters: []
      responses:
        '201':
          description: clocked in (geofence pass)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                  lifecycle_state:
                    type: string
                  geofence:
                    type: string
                  distance_m:
                    type: integer
                    nullable: true
        '422':
          description: too far from the home
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  distance_m:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - clock_in
                  - clock_out
                client_event_id:
                  type: string
                  format: uuid
                occurred_at:
                  type: string
                  format: date-time
                lat:
                  type: number
                  nullable: true
                lng:
                  type: number
                  nullable: true
                accuracy_m:
                  type: integer
                  nullable: true
                device_fingerprint:
                  type: string
                  format: uuid
                  nullable: true
              required:
              - kind
              - client_event_id
              - occurred_at
  "/api/v1/staff/sync/events":
    post:
      summary: Sync offline clock events (batch, idempotent)
      tags:
      - Sync
      security:
      - bearerAuth: []
      description: Uploads the PWA outbox. Each event is idempotent on client_event_id;
        out-of-range offline clock-ins are recorded + flagged, never dropped.
      parameters: []
      responses:
        '200':
          description: ingest results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        client_event_id:
                          type: string
                        status:
                          type: string
                        geofence:
                          type: string
                          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      visit_assignment_id:
                        type: integer
                      kind:
                        type: string
                      client_event_id:
                        type: string
                      occurred_at:
                        type: string
                      lat:
                        type: number
                        nullable: true
                      lng:
                        type: number
                        nullable: true
  "/api/v1/staff/sync/changes":
    get:
      summary: Download visits to cache offline
      tags:
      - Sync
      security:
      - bearerAuth: []
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
      description: The carer's non-terminal assigned visits + service-user home coords
        for the offline geofence.
      responses:
        '200':
          description: changeset
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                  cursor:
                    type: string
                  visits:
                    type: array
                    items:
                      "$ref": "#/components/schemas/VisitAssignment"
  "/api/v1/staff/webauthn/registration/options":
    post:
      summary: Passkey registration options
      tags:
      - WebAuthn
      security:
      - bearerAuth: []
      description: Returns WebAuthn PublicKeyCredentialCreationOptions plus a signed
        challenge_token to echo back.
      responses:
        '200':
          description: creation options
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_token:
                    type: string
                  options:
                    type: object
                    description: PublicKeyCredentialCreationOptions (base64url fields)
                      for navigator.credentials.create()
  "/api/v1/staff/webauthn/registration":
    post:
      summary: Register a passkey
      tags:
      - WebAuthn
      security:
      - bearerAuth: []
      description: Verifies the attestation from navigator.credentials.create() and
        stores the public-key credential.
      parameters: []
      responses:
        '201':
          description: passkey stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickname:
                    type: string
                    nullable: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                credential:
                  type: object
                  description: PublicKeyCredential from navigator.credentials.create()
                nickname:
                  type: string
              required:
              - challenge_token
              - credential
  "/api/v1/staff/webauthn/authentication/options":
    post:
      summary: Passkey authentication options
      tags:
      - WebAuthn
      description: Returns PublicKeyCredentialRequestOptions for a passwordless (biometric)
        login.
      parameters: []
      responses:
        '200':
          description: request options
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_token:
                    type: string
                  options:
                    type: object
                    description: PublicKeyCredentialRequestOptions for navigator.credentials.get()
        '404':
          description: no passkey enrolled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/api/v1/staff/webauthn/authentication":
    post:
      summary: Log in with a passkey (biometric)
      tags:
      - WebAuthn
      description: Verifies the assertion from navigator.credentials.get() and issues
        an access token.
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  employee:
                    "$ref": "#/components/schemas/Employee"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                credential:
                  type: object
              required:
              - challenge_token
              - credential
