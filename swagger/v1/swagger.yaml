      description: Applies a new password using the token from the reset email.
      parameters: []
      responses:
        '204':
          description: password changed
        '422':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
  "/api/v1/auth/refresh":
    post:
      summary: Rotate a refresh token
      tags:
      - Auth
      description: Exchanges a refresh token for a fresh access token + a new refresh
        token (the old one is revoked). Reusing a revoked token nukes the chain.
      parameters: []
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  access_expires_at:
                    type: string
                  refresh_token:
                    type: string
                  employee:
                    "$ref": "#/components/schemas/Employee"
        '401':
          description: invalid/expired
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
