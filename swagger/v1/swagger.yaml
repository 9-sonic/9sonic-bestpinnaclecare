---
openapi: 3.0.1
info:
  title: Best Pinnacle Care API
  version: v1
  description: |
    Phase 1 API. Two separate identities with separate logins:
    **Admin** (office) and **Employee** (carer PWA).

    Auth is JWT (bearer). Log in at the identity-specific endpoint to get an
    `access` token, then send `Authorization: Bearer <token>`. Admins may have
    TOTP MFA (two-step login); carers can log in with a passkey (WebAuthn).
servers:
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: invalid_credentials
        details:
          type: object
          nullable: true
      required:
      - error
    Admin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: boss@bestpinnacle.test
        first_name:
          type: string
          example: Reg
        last_name:
          type: string
          example: Manager
        full_name:
          type: string
          example: Reg Manager
        avatar_url:
          type: string
          nullable: true
          description: Absolute URL of the uploaded avatar, or null.
        role:
          type: string
          enum:
          - registered_manager
          - manager
          - coordinator
          - finance
          - auditor
        active:
          type: boolean
          example: true
        mfa_enabled:
          type: boolean
          example: true
        invited_at:
          type: string
          format: date-time
          nullable: true
        accepted_invite_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the invite link has been used to set a password.
    Employee:
      type: object
      description: Private fields (emergency contact) appear only with include_private
        (self/office); pay fields only with include_pay (self/finance).
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: carer@bestpinnacle.test
        first_name:
          type: string
          example: Cara
        last_name:
          type: string
          example: Erikson
        full_name:
          type: string
          example: Cara Erikson
        phone:
          type: string
          nullable: true
          example: 07700 900000
        avatar_url:
          type: string
          nullable: true
          description: Absolute URL of the uploaded avatar, or null.
        role:
          type: string
          enum:
          - carer
        employee_reference:
          type: string
          nullable: true
        contracted_hours_per_week:
          type: number
          nullable: true
          example: 37.5
        active:
          type: boolean
          example: true
        mfa_enabled:
          type: boolean
          example: false
        emergency_contact_name:
          type: string
          nullable: true
          description: Only with include_private.
        emergency_contact_phone:
          type: string
          nullable: true
          description: Only with include_private.
        hourly_rate_pence:
          type: integer
          nullable: true
          description: Only with include_pay.
        mileage_rate_pence:
          type: integer
          nullable: true
          description: Only with include_pay.
    ServiceUser:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        reference:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address_line1:
          type: string
          nullable: true
        address_line2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        geofence_radius_m:
          type: integer
        geofence_mode:
          type: string
          nullable: true
        access_notes:
          type: string
          nullable: true
        active:
          type: boolean
    Visit:
      type: object
      properties:
        id:
          type: integer
        service_user_id:
          type: integer
        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
        staff_required:
          type: integer
        notes:
          type: string
          nullable: true
        published_at:
          type: string
          nullable: true
        service_user:
          allOf:
          - "$ref": "#/components/schemas/ServiceUser"
          nullable: true
          description: Nested only when the endpoint sets include_service_user (e.g.
            visit list, visit detail).
    VisitAssignment:
      type: object
      properties:
        id:
          type: integer
        visit_id:
          type: integer
        employee_id:
          type: integer
        lifecycle_state:
          type: string
          enum:
          - scheduled
          - check_in_window
          - grace_period
          - late
          - in_progress
          - overdue
          - pending_review
          - completed
          - missed
          - cancelled
        assignment_status:
          type: string
        actual_start:
          type: string
          format: date-time
          nullable: true
          description: Clock-in time.
        actual_end:
          type: string
          format: date-time
          nullable: true
          description: Clock-out time.
        worked_minutes:
          type: integer
          nullable: true
        flags:
          type: array
          items:
            type: string
        visit:
          "$ref": "#/components/schemas/Visit"
paths:
  "/api/v1/admin/admins":
    get:
      summary: List office users
      tags:
      - Office — People
      security:
      - bearerAuth: []
      responses:
        '200':
          description: admins
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Admin"
    post:
      summary: Invite an office user (registered manager only)
      tags:
      - Office — People
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: invited
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Admin"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  enum:
                  - registered_manager
                  - manager
                  - coordinator
                  - finance
                  - auditor
                phone:
                  type: string
              required:
              - email
              - first_name
              - last_name
              - role
  "/api/v1/admin/admins/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show an office user
      tags:
      - Office — People
      security:
      - bearerAuth: []
      responses:
        '200':
          description: admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Admin"
    patch:
      summary: Update an office user (registered manager only)
      tags:
      - Office — People
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Admin"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                role:
                  type: string
                active:
                  type: boolean
  "/api/v1/admin/employees/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a carer
      tags:
      - Office — People
      security:
      - bearerAuth: []
      responses:
        '200':
          description: carer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
    patch:
      summary: Update a carer
      tags:
      - Office — People
      security:
      - bearerAuth: []
      description: Pay rates (hourly_rate_pence, mileage_rate_pence) are ignored unless
        the caller is finance or registered manager.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                active:
                  type: boolean
                contracted_hours_per_week:
                  type: number
                hourly_rate_pence:
                  type: integer
                mileage_rate_pence:
                  type: integer
  "/api/v1/admin/employees/{id}/availability":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: A carer's weekly availability pattern
      tags:
      - Office — People
      security:
      - bearerAuth: []
      responses:
        '200':
          description: availability
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    weekday:
                      type: integer
                      description: 0=Monday .. 6=Sunday
                    slot:
                      type: string
                      enum:
                      - morning
                      - afternoon
                      - evening
                      - night
                    available:
                      type: boolean
  "/api/v1/admin/care_package_slots/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Edit a recurring call
      tags:
      - Office — Care Packages
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                recurrence:
                  type: string
                staff_required:
                  type: integer
                break_minutes:
                  type: integer
                active:
                  type: boolean
  "/api/v1/admin/service_users/{service_user_id}/care_plan_items/{id}":
    parameters:
    - name: service_user_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Edit a care plan item
      tags:
      - Office — Care Plan
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                label:
                  type: string
                detail:
                  type: string
                position:
                  type: integer
    delete:
      summary: Remove a care plan item (soft-delete)
      tags:
      - Office — Care Plan
      security:
      - bearerAuth: []
      description: 'Sets active: false; the item and its history are kept.'
      responses:
        '204':
          description: removed
  "/api/v1/admin/alerts/{id}/acknowledge":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Acknowledge an alert
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      responses:
        '200':
          description: acknowledged
  "/api/v1/admin/alerts/{id}/resolve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Resolve an alert (optional note)
      tags:
      - Office — Monitoring
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: resolved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_note:
                  type: string
  "/api/v1/admin/timesheet_disputes":
    get:
      summary: Open timesheet disputes (newest first)
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      responses:
        '200':
          description: disputes
  "/api/v1/admin/timesheet_disputes/{id}/resolve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Resolve a timesheet dispute
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: resolved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_note:
                  type: string
  "/api/v1/admin/timesheet_exports/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Export a period (CSV or XLSX)
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      description: type=csv (default) or type=xlsx. Streams a file for payroll.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
      responses:
        '200':
          description: file
  "/api/v1/admin/timesheet_periods/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a period with its lines
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      responses:
        '200':
          description: period + lines
  "/api/v1/admin/timesheet_periods/{id}/approve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Approve a period (blocked by unconfirmed lines)
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      description: '422 { error: ''unconfirmed_lines'' } if any line is auto-closed
        or its visit is still pending review.'
      responses:
        '200':
          description: approved
  "/api/v1/admin/timesheet_periods/{id}/lock":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Lock a period (final; payroll exported)
      tags:
      - Office — Timesheets
      security:
      - bearerAuth: []
      responses:
        '200':
          description: locked
  "/api/v1/admin/visit_assignments/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Withdraw an assignment (for reassignment)
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      description: Marks the assignment withdrawn + cancelled and appends an assignment.withdrawn
        audit event. The original record is kept.
      responses:
        '204':
          description: withdrawn
  "/api/v1/admin/rota_exports":
    get:
      summary: Export the rota (CSV or XLSX)
      tags:
      - Office — Rota
      security:
      - bearerAuth: []
      description: Visits + carer assignments for a date range. type=csv (default)
        or xlsx.
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
      responses:
        '200':
          description: file
  "/api/v1/admin/audit_exports":
    get:
      summary: Export the audit log (CSV or XLSX)
      tags:
      - Office — Audit
      security:
      - bearerAuth: []
      description: Append-only Event log as a file. Same filters as /admin/audit (event_type,
        aggregate_type, limit). type=csv (default) or xlsx.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
      - name: event_type
        in: query
        required: false
        schema:
          type: string
      - name: aggregate_type
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: file
  "/api/v1/admin/report_exports":
    get:
      summary: Export the report pack (CSV or XLSX)
      tags:
      - Office — Reports
      security:
      - bearerAuth: []
      description: Clocking-performance aggregates for a date range. type=csv (default)
        or xlsx.
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - xlsx
      responses:
        '200':
          description: file
  "/api/v1/admin/auth/login":
    post:
      summary: Admin login
      tags:
      - Auth — Admin
      description: Authenticates against the admins table only. Returns an access
        token, or an MFA challenge (mfa_required + mfa_token) when the admin has MFA
        enabled.
      parameters: []
      responses:
        '200':
          description: authenticated (or MFA challenge)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    nullable: true
                  admin:
                    "$ref": "#/components/schemas/Admin"
                  mfa_required:
                    type: boolean
                    nullable: true
                  mfa_token:
                    type: string
                    nullable: true
                  mfa_setup_required:
                    type: boolean
                    nullable: true
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: boss@bestpinnacle.test
                password:
                  type: string
                  example: secret12
              required:
              - email
              - password
  "/api/v1/staff/auth/login":
    post:
      summary: Carer login
      tags:
      - Auth — Staff
      description: Authenticates against the employees table only.
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  employee:
                    "$ref": "#/components/schemas/Employee"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/mfa":
    post:
      summary: Complete MFA (two-step login)
      tags:
      - Auth
      description: Exchanges the mfa_token from login + a TOTP or backup code for
        an access token.
      parameters: []
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  admin:
                    "$ref": "#/components/schemas/Admin"
        '401':
          description: invalid or expired code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token:
                  type: string
                otp_code:
                  type: string
                  example: '123456'
              required:
              - mfa_token
              - otp_code
  "/api/v1/auth/logout":
    delete:
      summary: Log out (revoke token)
      tags:
      - Auth
      security:
      - bearerAuth: []
      description: Denylists the presented bearer token. Requires a valid admin or
        employee token.
      responses:
        '204':
          description: logged out
        '401':
          description: unauthenticated
  "/api/v1/admin/me":
    get:
      summary: Current admin
      tags:
      - Auth — Admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: the signed-in admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Admin"
        '401':
          description: missing/invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/staff/me":
    get:
      summary: Current carer (private fields + pay)
      tags:
      - Carer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
    patch:
      summary: Edit own profile
      tags:
      - Carer
      security:
      - bearerAuth: []
      description: Name, phone and emergency contact. Email + employee_reference stay
        office-controlled.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Employee"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                emergency_contact_name:
                  type: string
                emergency_contact_phone:
                  type: string
  "/api/v1/admin/audit":
    get:
      summary: Audit trail (append-only event log)
      tags:
      - Office — Audit
      security:
      - bearerAuth: []
      description: Who did what, when and why. Read-only; entries are never altered.
      parameters:
      - name: event_type
        in: query
        required: false
        schema:
          type: string
      - name: aggregate_type
        in: query
        required: false
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: ISO8601 cursor
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: events, newest first
  "/api/v1/admin/reports":
    get:
      summary: Clocking performance aggregates
      tags:
      - Office — Reports
      security:
      - bearerAuth: []
      description: Attendance, punctuality, hours and exceptions over a date range.
        Defaults to the last 7 days.
      parameters:
      - name: from
        in: query
        required: false
        description: ISO8601
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: ISO8601
        schema:
          type: string
      responses:
        '200':
          description: aggregates
  "/api/v1/admin/cover":
    get:
      summary: Cover board — unfilled visits and their offers
      tags:
      - Office — Cover
      security:
      - bearerAuth: []
      responses:
        '200':
          description: open shifts + counts
  "/api/v1/admin/cover_offers":
    post:
      summary: Offer an unfilled visit to a carer
      tags:
      - Office — Cover
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: offer created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visit_id:
                  type: integer
                employee_id:
                  type: integer
                note:
                  type: string
              required:
              - visit_id
              - employee_id
  "/api/v1/admin/cover_offers/{id}/accept":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Accept an offer — fills the visit and creates the assignment
      tags:
      - Office — Cover
      security:
      - bearerAuth: []
      responses:
        '200':
          description: accepted
  "/api/v1/admin/cover_offers/{id}/decline":
    parameters:
    - name: id
