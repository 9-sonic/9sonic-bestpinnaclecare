      - Carer
      security:
      - bearerAuth: []
      description: Notes append; they are never overwritten. Idempotent on client_note_id
        so a replay after a dead zone cannot create two notes. supersedes_id links
        a correction to what it replaces.
      parameters: []
      responses:
        '201':
          description: note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  body:
                    type: string
                  client_note_id:
                    type: string
                  created_at:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                client_note_id:
                  type: string
                  format: uuid
                supersedes_id:
                  type: integer
              required:
              - body
  "/api/v1/staff/visit_assignments/{visit_assignment_id}/break":
    parameters:
    - name: visit_assignment_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Start or end a break (via the clock pipeline)
      tags:
      - Carer
      security:
      - bearerAuth: []
      description: Reuses the clock-event pipeline (idempotent, geofenced, audited)
        so a real break lands on the timesheet, not the scheduled one. Does not change
        the visit lifecycle. Idempotent on client_event_id.
      parameters: []
      responses:
        '201':
          description: break recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                  kind:
                    type: string
                  status:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                  - start
                  - end
                client_event_id:
                  type: string
                  format: uuid
                occurred_at:
                  type: string
                  format: date-time
                lat:
                  type: number
                  nullable: true
                lng:
                  type: number
                  nullable: true
                accuracy_m:
                  type: integer
                  nullable: true
              required:
              - phase
              - client_event_id
