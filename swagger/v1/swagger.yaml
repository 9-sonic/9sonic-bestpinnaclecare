    parameters:
    - name: visit_assignment_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Clock in/out of a visit (geofenced)
      tags:
      - Clocking
      security:
      - bearerAuth: []
      description: Live clock-in/out at the service user's home. Within 150 m -> pass;
        outside -> 422 too_far; no GPS -> allowed + flagged. Idempotent on client_event_id.
      parameters: []
      responses:
        '201':
          description: clocked in (geofence pass)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                  lifecycle_state:
                    type: string
                  geofence:
                    type: string
                  distance_m:
                    type: integer
                    nullable: true
        '422':
          description: too far from the home
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  distance_m:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - clock_in
                  - clock_out
                client_event_id:
                  type: string
                  format: uuid
                occurred_at:
                  type: string
                  format: date-time
                lat:
                  type: number
                  nullable: true
                lng:
                  type: number
                  nullable: true
                accuracy_m:
                  type: integer
                  nullable: true
                device_fingerprint:
                  type: string
                  format: uuid
                  nullable: true
              required:
              - kind
              - client_event_id
              - occurred_at
