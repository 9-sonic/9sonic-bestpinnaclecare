<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#10b3c6" />
    <meta name="description" content="Clock in and out, view shifts and message your team." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pinnacle Care" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icons/icon-192.png" />
    <!-- iOS ignores the manifest for the home screen icon and uses this. It was
         pointing at the full landscape logo, which iOS then squashed. -->
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />

    <!-- The four typefaces the design is drawn in. Until now none were loaded
         at all, so every screen rendered in the Segoe UI fallback and none of
         the type in the design had ever actually been seen in the app.

         Plus Jakarta Sans carries the interface, Outfit the section headings,
         Raleway client names and Figtree the times. display=swap so a carer on
         a slow connection gets readable text immediately rather than a blank
         screen; the service worker caches the files for offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Raleway:wght@500;600;700&family=Figtree:wght@500;600;700&display=swap"
    />

    <title>Best Pinnacle Care — Carer</title>
    <script>
      // Apply the saved theme before first paint so a dark-mode user never sees
      // a white flash on launch. Falls back to the OS preference.
      (function () {
        try {
          var saved = localStorage.getItem('bpc.theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0f171e' : '#10b3c6');
          // Larger text preference, applied before paint to avoid a reflow.
          document.documentElement.dataset.textSize =
            localStorage.getItem('bpc.textSize') === 'large' ? 'large' : 'normal';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      /* Paint the brand immediately, before any JS or CSS bundle arrives, so a
         cold PWA launch never flashes a blank screen.

         This must stay visually identical to .splash in global.css: the React
         splash replaces this element mid-launch, and any difference between the
         two reads as a flash. Same artwork, same logo, same geometry. The flat
         teal is sampled from the top of the wallpaper so it stands in until the
         image decodes. Both are theme-independent by design. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #047c7f url('/brand/wallpaper.webp') center / cover no-repeat;
        z-index: 200;
        transition: opacity 0.3s ease;
      }
      #boot img {
        width: min(53vw, 218px);
        margin-bottom: 4vh;
      }
      #boot.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot"><img src="/brand/logo-mono.webp" alt="Best Pinnacle Care" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove the boot cover once React has mounted something.
      window.addEventListener('DOMContentLoaded', () => {
        const boot = document.getElementById('boot');
        const root = document.getElementById('root');
        const done = () => {
          boot.classList.add('is-hidden');
          setTimeout(() => boot.remove(), 320);
        };
        if (root.childElementCount) return done();
        new MutationObserver((_, obs) => {
          if (root.childElementCount) {
            obs.disconnect();
            done();
          }
        }).observe(root, { childList: true });
      });
    </script>
  </body>
</html>
