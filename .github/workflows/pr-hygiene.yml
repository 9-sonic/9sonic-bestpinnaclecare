name: PR hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Template gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Enforce PR template rules
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const action = context.payload.action;
            const body = context.payload.pull_request.body || '';
            const processOnly = /Process-only:\s*true/i.test(body);

            // List files in the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const paths = files.map((f) => f.filename);

            const touchesUi = paths.some(
              (p) =>
                p.startsWith('client/pwa/') ||
                p.startsWith('client/admin-web/')
            );
            const onlyProcessPaths = paths.every(
              (p) =>
                p.startsWith('docs/') ||
                p.startsWith('.github/') ||
                p.startsWith('.claude/') ||
                p === 'README.md' ||
                p === 'CONTRIBUTING.md' ||
                p === '.gitignore'
            );

            const hasIssueLink = /(Closes|Fixes|Resolves)\s+#\d+/i.test(body);
            const hasScope =
              /client\/pwa|client\/admin-web|\/contracts|\/docs|Rails|\/app\//i.test(
                body
              );
            const hasScreenshot =
              /!\[[^\]]*\]\([^)]+\)/i.test(body) ||
              /<img[\s>]/i.test(body) ||
              /user-attachments\/assets\//i.test(body) ||
              /github\.com\/.*\/assets\//i.test(body);

            const missing = [];
            if (!hasIssueLink && !processOnly) {
              missing.push(
                'Link an issue with `Closes #N` (or Fixes/Resolves), or set `Process-only: true` for pure infra/docs PRs.'
              );
            }
            if (!hasScope) {
              missing.push(
                'Tick monorepo **Scope** in the PR template (`client/pwa`, `client/admin-web`, Rails root, `/contracts`, and/or `/docs`).'
              );
            }
            if (touchesUi && !hasScreenshot) {
              missing.push(
                'UI paths (`client/pwa/` or `client/admin-web/`) changed — attach a screenshot (markdown image or GitHub attachment).'
              );
            }

            // Sticky comment
            const marker = '<!-- pr-hygiene-bot -->';
            const lines = [marker];
            if (missing.length) {
              lines.push('### PR template gate — action required');
              lines.push('');
              lines.push('This check **fails** until the description is fixed:');
              for (const m of missing) lines.push(`- ${m}`);
              lines.push('');
            } else {
              lines.push('### PR template gate');
              lines.push('');
              lines.push('Template checks passed.');
              if (processOnly) {
                lines.push('_Process-only PR — issue link not required._');
              }
              if (onlyProcessPaths) {
                lines.push('_No product package paths in this diff._');
              }
              lines.push('');
            }

            const needCopilotNote = ['opened', 'reopened', 'ready_for_review'].includes(
              action
            );
            if (needCopilotNote) {
              lines.push('### Copilot review');
              lines.push(
                'Confirm **Copilot** is reviewing (workflow requests it; assign manually under Reviewers → `copilot` if missing).'
              );
              lines.push(
                'Do not merge until Copilot has commented and critical findings are resolved.'
              );
              lines.push('');
            }

            lines.push(
              '**Green checks:** Template gate · CI summary · Secret scan · Request Copilot review'
            );

            const text = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            const existing = comments.find(
              (c) =>
                c.user &&
                c.user.type === 'Bot' &&
                (c.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: text,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: text,
              });
            }

            if (missing.length) {
              core.setFailed('PR template incomplete:\n' + missing.join('\n'));
            } else {
              core.info('PR template gate passed.');
            }
