name: PR hygiene

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  remind:
    name: Template & Copilot reminders
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Comment if linked issue or Copilot notes missing
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const missing = [];
            if (!/(Closes|Fixes|Resolves)\s+#\d+/i.test(body)) {
              missing.push('Link an issue with `Closes #N` (or Fixes/Resolves).');
            }
            if (!/\/pwa|\/admin-web|\/backend|\/contracts|\/docs/i.test(body)) {
              missing.push('Tick the monorepo **Scope** checkboxes in the PR template.');
            }

            // Always remind about Copilot on open/reopen (private free plans cannot auto-request via ruleset)
            const needCopilot = ['opened', 'reopened', 'ready_for_review'].includes(context.payload.action);
            const lines = [];
            if (missing.length) {
              lines.push('### PR template check');
              lines.push('Please update the description:');
              for (const m of missing) lines.push(`- ${m}`);
              lines.push('');
            }
            if (needCopilot) {
              lines.push('### Copilot review (required)');
              lines.push('This private repo cannot auto-assign Copilot without **GitHub Pro** branch rulesets.');
              lines.push('**Assign Copilot manually:** Reviewers → search `copilot` → select **Copilot**.');
              lines.push('Do not merge until Copilot has commented and critical findings are resolved.');
              lines.push('');
              lines.push('Also wait for **CI summary** and **Secret scan** to pass.');
            }
            if (!lines.length) return;

            const marker = '<!-- pr-hygiene-bot -->';
            const text = marker + '\n' + lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: text,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: text,
              });
            }
