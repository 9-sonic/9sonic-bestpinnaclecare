name: Project board sync

# Moves linked issues on org project "Best Pinnacle" (#1):
#   PR open/update → In Review
#   PR merged      → Done
#
# Uses PROJECT_TOKEN if set (classic/fine-grained PAT with repo + project),
# otherwise GITHUB_TOKEN. Org project writes often need PROJECT_TOKEN.
# Soft-fail: never blocks merge.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  sync:
    name: Sync Best Pinnacle board
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Update project Status for linked issues
        uses: actions/github-script@v7
        env:
          # Optional: PAT with `repo` + `project` (or fine-grained Project + Issues)
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Best Pinnacle — https://github.com/orgs/9-sonic/projects/1
          PROJECT_ID: PVT_kwDOEZ-wcM4BeQza
          STATUS_FIELD_ID: PVTSSF_lADOEZ-wcM4BeQzazhYsVjg
          STATUS_IN_REVIEW: 7a14373a
          STATUS_DONE: c8424246
        with:
          github-token: ${{ secrets.PROJECT_TOKEN != '' && secrets.PROJECT_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const pull_number = pr.number;
            const body = pr.body || '';
            const merged = pr.merged === true;
            const closed = context.payload.action === 'closed';

            const PROJECT_ID = process.env.PROJECT_ID;
            const STATUS_FIELD_ID = process.env.STATUS_FIELD_ID;
            const STATUS_IN_REVIEW = process.env.STATUS_IN_REVIEW;
            const STATUS_DONE = process.env.STATUS_DONE;

            const statusOptionId =
              closed && merged ? STATUS_DONE : closed ? null : STATUS_IN_REVIEW;
            if (!statusOptionId) {
              core.info('PR closed without merge — no board status change.');
              return;
            }

            // Issue numbers from body closing keywords
            const fromBody = new Set();
            const re = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            let m;
            while ((m = re.exec(body)) !== null) {
              fromBody.add(parseInt(m[1], 10));
            }

            // Also pull closingIssuesReferences via GraphQL
            let issueNodeIds = [];
            try {
              const q = `
                query($owner:String!, $repo:String!, $number:Int!) {
                  repository(owner:$owner, name:$repo) {
                    pullRequest(number:$number) {
                      closingIssuesReferences(first: 20) {
                        nodes { id number }
                      }
                      body
                    }
                  }
                }`;
              const result = await github.graphql(q, {
                owner,
                repo,
                number: pull_number,
              });
              const nodes =
                result.repository.pullRequest.closingIssuesReferences.nodes ||
                [];
              for (const n of nodes) {
                fromBody.add(n.number);
                issueNodeIds.push({ id: n.id, number: n.number });
              }
            } catch (err) {
              core.warning('GraphQL closingIssuesReferences failed: ' + err.message);
            }

            // Resolve remaining numbers to node IDs
            for (const num of fromBody) {
              if (issueNodeIds.some((x) => x.number === num)) continue;
              try {
                const iq = `
                  query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      issue(number:$number) { id number }
                    }
                  }`;
                const ir = await github.graphql(iq, {
                  owner,
                  repo,
                  number: num,
                });
                if (ir.repository.issue) {
                  issueNodeIds.push({
                    id: ir.repository.issue.id,
                    number: ir.repository.issue.number,
                  });
                }
              } catch (err) {
                core.warning(`Could not resolve issue #${num}: ${err.message}`);
              }
            }

            // Dedupe by number
            const byNum = new Map();
            for (const x of issueNodeIds) byNum.set(x.number, x);
            issueNodeIds = [...byNum.values()];

            if (!issueNodeIds.length) {
              core.info('No linked issues found on this PR — board sync skipped.');
              return;
            }

            const targetLabel = closed && merged ? 'Done' : 'In Review';
            let ok = 0;
            let fail = 0;

            for (const issue of issueNodeIds) {
              try {
                // Add to project if needed
                const addMut = `
                  mutation($projectId:ID!, $contentId:ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId
                      contentId: $contentId
                    }) {
                      item { id }
                    }
                  }`;
                let itemId;
                try {
                  const added = await github.graphql(addMut, {
                    projectId: PROJECT_ID,
                    contentId: issue.id,
                  });
                  itemId = added.addProjectV2ItemById.item.id;
                } catch (addErr) {
                  // May already be on project — find item id
                  const findQ = `
                    query($projectId:ID!, $cursor:String) {
                      node(id: $projectId) {
                        ... on ProjectV2 {
                          items(first: 100, after: $cursor) {
                            nodes {
                              id
                              content {
                                ... on Issue { number }
                              }
                            }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }`;
                  let cursor = null;
                  let found = null;
                  for (let page = 0; page < 10 && !found; page++) {
                    const pageResult = await github.graphql(findQ, {
                      projectId: PROJECT_ID,
                      cursor,
                    });
                    const items = pageResult.node.items;
                    found = items.nodes.find(
                      (n) => n.content && n.content.number === issue.number
                    );
                    if (found) itemId = found.id;
                    if (!items.pageInfo.hasNextPage) break;
                    cursor = items.pageInfo.endCursor;
                  }
                  if (!itemId) throw addErr;
                }

                const upd = `
                  mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item { id }
                    }
                  }`;
                await github.graphql(upd, {
                  projectId: PROJECT_ID,
                  itemId,
                  fieldId: STATUS_FIELD_ID,
                  optionId: statusOptionId,
                });
                core.info(`#${issue.number} → ${targetLabel}`);
                ok++;
              } catch (err) {
                fail++;
                core.warning(
                  `Board sync failed for #${issue.number}: ${err.message}`
                );
              }
            }

            if (fail && !ok) {
              core.warning(
                'Board sync could not update project items. Add repo secret PROJECT_TOKEN (PAT with project + repo access) if GITHUB_TOKEN lacks org project write.'
              );
            } else {
              core.info(`Board sync complete: ${ok} updated, ${fail} failed.`);
            }
