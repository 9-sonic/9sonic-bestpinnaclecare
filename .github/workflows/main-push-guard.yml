name: Main push guard

# Soft education when commits land on main without a PR merge.
# Cannot block pushes without GitHub Pro branch protection — warns in Actions log
# and opens an issue comment only if we can attribute a PR (merge commits are fine).

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    name: Check push source
    runs-on: ubuntu-latest
    steps:
      - name: Detect direct push (non-merge)
        uses: actions/github-script@v7
        with:
          script: |
            const commitMessage = context.payload.head_commit?.message || '';
            const isMerge =
              commitMessage.startsWith('Merge pull request') ||
              commitMessage.startsWith('Merge branch') ||
              (context.payload.commits || []).length > 1 &&
                commitMessage.toLowerCase().includes('merge');

            // GitHub merge button usually creates a merge commit or squash with PR ref
            const hasPrRef = /#\d+/.test(commitMessage) && /merge/i.test(commitMessage);

            if (isMerge || hasPrRef) {
              core.info('Push looks like a PR merge — OK.');
              return;
            }

            const sha = context.sha.slice(0, 7);
            const who =
              context.payload.pusher?.name ||
              context.payload.sender?.login ||
              'unknown';
            const msg = (commitMessage.split('\n')[0] || '(no message)').slice(0, 120);

            core.warning(
              [
                'Direct push to main detected (not a clear PR merge).',
                `Commit: ${sha} by ${who}: ${msg}`,
                'Process: use a feature branch and open a pull request into main.',
                'Reviews (Copilot/Fireworks) and PR checks do not run the same way on bare pushes.',
              ].join(' ')
            );

            // Annotation for the Actions UI
            core.notice(
              'Prefer PR → main. Direct pushes skip the PR review request UI.'
            );
