name: 🚀 Deploy

# Runs only on push to main — i.e. after a PR was merged, by which point PR
# checks (CI, hygiene, reviews) have already passed on the pull request.
on:
  push:
    branches: [main]
  # Manual redeploy. A push deploys only the side whose files changed (paths
  # filter below); a manual run has no diff, so the filter reports "nothing
  # changed" and would deploy nothing. `target` lets you force one side — e.g.
  # re-ship the PWA's static bundle without touching its source.
  workflow_dispatch:
    inputs:
      target:
        description: Which side to force-deploy
        type: choice
        options: [all, backend, pwa, admin-web]
        default: all

# Path-scoped deploys: the Rails API, the carer PWA, and the admin web app each
# deploy only when their own files change; a change to several deploys several.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Paths live under the Virtualmin virtual-server user's home (/home/qqwqvwsb).
  # SERVER_USER (secret) must be that domain Unix user (qqwqvwsb); keep these in
  # sync with it AND with deploy/systemd/bestpinnacle-api.service.
  API_DIR: /home/qqwqvwsb/api      # Rails API (repo root)
  BACKEND_SERVICE: bestpinnacle-api
  # Static web roots for the two SPAs. Set these as repo *variables*
  # (Settings → Secrets and variables → Actions → Variables) to the actual
  # Virtualmin document root of each subdomain — the defaults below are a guess.
  PWA_DIR: ${{ vars.PWA_WEB_ROOT || '/home/qqwqvwsb/domains/staff.bestpinnaclecare.co.uk/public_html' }}
  ADMIN_WEB_DIR: ${{ vars.ADMIN_WEB_ROOT || '/home/qqwqvwsb/domains/admin.bestpinnaclecare.co.uk/public_html' }}

jobs:
  # ---- Detect what changed so we only deploy the affected side ----
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      pwa: ${{ steps.filter.outputs.pwa }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'config/**'
              - 'db/**'
              - 'lib/**'
              - 'bin/**'
              - '.github/workflows/deploy.yml'
              - 'public/**'
              - 'vendor/**'
              - 'deploy/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'Rakefile'
              - 'config.ru'
              - '.ruby-version'
            pwa:
              - 'client/pwa/**'
            admin_web:
              - 'client/admin-web/**'

  # ---- Deploy the Rails API (repo root) ----
  backend:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","backend"]'), inputs.target))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Ship source only; server-side secrets (.env, master.key), runtime dirs
      # (tmp, log, storage), tests and the frontend are excluded so --delete
      # can't wipe them.
      - name: Sync Rails app
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='client' \
            --exclude='docs' \
            --exclude='spec' \
            --exclude='node_modules' \
            --exclude='tmp' \
            --exclude='log' \
            --exclude='storage' \
            --exclude='.env' \
            --exclude='config/master.key' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.API_DIR }}/

      - name: Install gems, migrate, bootstrap carer & restart API
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "set -e
             export PATH=\"\$HOME/.rbenv/bin:\$HOME/.rbenv/shims:\$PATH\"
             cd ${{ env.API_DIR }}
             set -a; . ${{ env.API_DIR }}/.env; set +a
             export RAILS_ENV=production
             # Active Storage resizes chat-image thumbnails through libvips (the
             # Rails 8 default processor via the image_processing gem). Without
             # the system library, ruby-vips can't load and every image variant
             # 500s. Install it here so the server always has it; apt no-ops fast
             # when it's already present. set -e aborts the deploy if this fails,
             # so we never ship a box that crashes on images.
             if ! ldconfig -p | grep -q 'libvips\.so\.42'; then
               sudo apt-get update
               sudo apt-get install -y --no-install-recommends libvips42
             fi
             bundle config set --local deployment true
             bundle config set --local without 'development test'
             bundle install
             bin/rails db:migrate
             SEED_CARER_PASSWORD='${{ vars.SEED_CARER_PASSWORD || 'Password123!' }}' bin/rails carer:bootstrap
             sudo install -m 0644 ${{ env.API_DIR }}/deploy/systemd/${{ env.BACKEND_SERVICE }}.service /etc/systemd/system/${{ env.BACKEND_SERVICE }}.service
             sudo systemctl daemon-reload
             sudo systemctl enable ${{ env.BACKEND_SERVICE }}
             sudo systemctl restart ${{ env.BACKEND_SERVICE }}"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ---- Deploy the carer PWA (client/pwa -> staff.bestpinnaclecare.co.uk) ----
  # React + Vite SPA. `npm run build` emits a static bundle to dist/, which the
  # Virtualmin vhost serves directly — no Node service. Skips cleanly until the
  # app is scaffolded (no package.json yet), so it never blocks a backend deploy.
  pwa:
    needs: changes
    if: >-
      needs.changes.outputs.pwa == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","pwa"]'), inputs.target))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build (skips until scaffolded)
        id: build
        working-directory: client/pwa
        env:
          # Vite inlines VITE_* at build time, so it must be set here.
          #
          # The app reads VITE_API_BASE_URL (see src/config/env.js). This job
          # was passing VITE_API_URL, which nothing reads, so every deployed
          # build shipped with an empty base URL. Falls back to the old
          # variable name so an existing repo variable keeps working.
          #
          # The value must include the /api/v1 prefix.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_API_URL }}
          # Explicit, so a deployed carer app can never serve mock shifts.
          VITE_USE_MOCK: 'false'
          # Google Maps JS key for the carer navigation screen. This is inlined
          # into the client bundle (public by design) — keep it locked down with
          # HTTP-referrer restrictions in Google Cloud, not hidden.
          VITE_MAPS_API_KEY: ${{ vars.VITE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "client/pwa not scaffolded yet — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile && pnpm run build
          elif [ -f yarn.lock ]; then
            corepack enable && corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile && yarn run build
          elif [ -f package-lock.json ]; then
            npm ci && npm run build
          else
            npm install && npm run build
          fi

      - name: Setup SSH
        if: steps.build.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Ship the built static bundle only; --delete keeps the web root clean.
      - name: Sync build to carer web root
        if: steps.build.outputs.skip != 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            client/pwa/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.PWA_DIR }}/


      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ---- Deploy the admin web app (client/admin-web -> admin.bestpinnaclecare.co.uk) ----
  admin-web:
    needs: changes
    if: >-
      needs.changes.outputs.admin_web == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","admin-web"]'), inputs.target))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build (skips until scaffolded)
        id: build
        working-directory: client/admin-web
        env:
          # Same correction as the PWA job above: the app reads
          # VITE_API_BASE_URL, not VITE_API_URL.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "client/admin-web not scaffolded yet — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile && pnpm run build
          elif [ -f yarn.lock ]; then
            corepack enable && corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile && yarn run build
          elif [ -f package-lock.json ]; then
            npm ci && npm run build
          else
            npm install && npm run build
          fi

      - name: Setup SSH
        if: steps.build.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync build to admin web root
        if: steps.build.outputs.skip != 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            client/admin-web/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.ADMIN_WEB_DIR }}/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
