name: Fireworks AI Code Review

# Quality-first AI review via Fireworks.
# Primary model: kimi-k2p7-code (quality). On timeout/API error: retry, then fallback model.
# Complements Copilot; does not replace PM merge judgment or Template gate.
#
# Secret: FIREWORKS_API_KEY
# Optional vars: FIREWORKS_MODEL, FIREWORKS_FALLBACK_MODEL, FIREWORKS_MAX_DIFF_CHARS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Fireworks review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr diff "${{ github.event.pull_request.number }}" > pr_diff_raw.txt || true
          if [ ! -s pr_diff_raw.txt ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            git diff "origin/${{ github.base_ref }}...HEAD" > pr_diff_raw.txt || true
          fi
          # Drop noisy lock / generated blobs so the model sees code first
          python3 <<'PY'
          from pathlib import Path
          import re
          raw = Path("pr_diff_raw.txt").read_text(errors="replace")
          skip_names = (
              "package-lock.json",
              "yarn.lock",
              "pnpm-lock.yaml",
              "Gemfile.lock",
              "Cargo.lock",
              "composer.lock",
              "go.sum",
              ".min.js",
              ".min.css",
              ".map",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".ico",
              ".pdf",
              ".woff",
              ".woff2",
          )
          parts = re.split(r"(?=^diff --git )", raw, flags=re.M)
          kept, dropped = [], []
          for p in parts:
              if not p.strip():
                  continue
              head = p[:400].lower()
              if any(s in head for s in skip_names):
                  m = re.search(r"diff --git a/(\S+)", p)
                  dropped.append(m.group(1) if m else "unknown")
                  continue
              kept.append(p)
          out = "".join(kept) if kept else raw
          note = ""
          if dropped:
              note = (
                  "\n\n_Omitted from model context (noise): "
                  + ", ".join(sorted(set(dropped))[:20])
                  + "_\n"
              )
          Path("pr_diff.txt").write_text(out + note)
          Path("diff_meta.txt").write_text(
              f"raw_chars={len(raw)}\nkept_chars={len(out)}\ndropped={len(dropped)}\n"
          )
          print(f"raw={len(raw)} kept={len(out)} dropped_files={len(dropped)}")
          PY
          BYTES=$(wc -c < pr_diff.txt | tr -d ' ')
          echo "diff_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          if [ "${BYTES:-0}" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review with Fireworks AI
        if: steps.diff.outputs.empty != 'true'
        uses: actions/github-script@v7
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          # Primary is the model that has actually been producing usable
          # reviews here. kimi-k2p7-code reasons inline and, on PR #51, spent
          # its whole budget thinking without ever emitting the format — set
          # the FIREWORKS_MODEL repo var to try it again.
          MODEL_NAME: ${{ vars.FIREWORKS_MODEL || 'accounts/fireworks/models/qwen3p7-plus' }}
          # Fallback when primary times out / 5xx / empty / answers off-format
          FALLBACK_MODEL: ${{ vars.FIREWORKS_FALLBACK_MODEL || 'accounts/fireworks/models/kimi-k2p7-code' }}
          FIREWORKS_BASE_URL: https://api.fireworks.ai/inference/v1
          MAX_DIFF_CHARS: ${{ vars.FIREWORKS_MAX_DIFF_CHARS || '32000' }}
          REQUEST_TIMEOUT_MS: '55000'
          RETRIES_PER_MODEL: '2'
          # Reasoning models need room to think *and* answer. 3500 was not
          # enough for either to finish.
          MAX_TOKENS: ${{ vars.FIREWORKS_MAX_TOKENS || '8000' }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- fireworks-ai-review-bot -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const pull_number = context.payload.pull_request.number;
            const pr = context.payload.pull_request;

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            async function postSticky(body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
              });
              const existing = comments.find(
                (c) =>
                  c.user &&
                  c.user.type === 'Bot' &&
                  (c.body || '').includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  event: 'COMMENT',
                  body,
                });
              } catch (err) {
                core.warning('Formal review post failed: ' + err.message);
              }
            }

            const apiKey = process.env.FIREWORKS_API_KEY;
            if (!apiKey) {
              await postSticky(
                [
                  marker,
                  '### Fireworks AI code review',
                  '',
                  'Skipped: repository secret **`FIREWORKS_API_KEY`** is not set.',
                  'Add it under **Settings → Secrets and variables → Actions**, then re-run.',
                ].join('\n')
              );
              core.warning('Missing FIREWORKS_API_KEY');
              return;
            }

            const primaryModel = process.env.MODEL_NAME;
            const fallbackModel = process.env.FALLBACK_MODEL;
            const baseUrl = process.env.FIREWORKS_BASE_URL.replace(/\/$/, '');
            const maxChars = parseInt(process.env.MAX_DIFF_CHARS || '32000', 10);
            const timeoutMs = parseInt(process.env.REQUEST_TIMEOUT_MS || '55000', 10);
            const retriesPerModel = parseInt(process.env.RETRIES_PER_MODEL || '2', 10);
            const maxTokens = parseInt(process.env.MAX_TOKENS || '8000', 10);

            // ---- Goal context: PR + linked GitHub issues + BES ids ----
            const title = pr.title || '';
            const body = (pr.body || '').trim() || '(no PR description)';
            const labels = (pr.labels || []).map((l) => l.name).join(', ') || '(none)';
            const author = (pr.user && pr.user.login) || 'unknown';
            const head = pr.head && pr.head.ref;
            const base = pr.base && pr.base.ref;

            const issueNums = new Set();
            const linkRe =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#(\d+)/gi;
            let m;
            const hay = title + '\n' + body;
            while ((m = linkRe.exec(hay)) !== null) issueNums.add(m[1]);
            const bareHash = /(?:^|[\s(,])#(\d{1,5})\b/g;
            while ((m = bareHash.exec(hay)) !== null) {
              if (issueNums.size < 5) issueNums.add(m[1]);
            }

            const besIds = [
              ...new Set(
                (hay.match(/\bBES-\d+\b/gi) || []).map((s) => s.toUpperCase())
              ),
            ].slice(0, 8);

            const linkedIssueBlocks = [];
            for (const n of [...issueNums].slice(0, 4)) {
              try {
                const { data: iss } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: parseInt(n, 10),
                });
                const issBody = (iss.body || '')
                  .replace(/\r\n/g, '\n')
                  .slice(0, 2500);
                linkedIssueBlocks.push(
                  [
                    `### GitHub #${n}: ${iss.title}`,
                    `State: ${iss.state}`,
                    issBody || '(empty body)',
                  ].join('\n')
                );
              } catch (err) {
                linkedIssueBlocks.push(
                  `### GitHub #${n}: (could not load: ${err.message})`
                );
              }
            }

            let diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff || !diff.trim()) {
              core.info('Empty diff, skipping.');
              return;
            }

            let truncatedNote = '';
            if (diff.length > maxChars) {
              // Prefer keeping head of each file hunk by taking prefix + tail of remaining budget
              const headKeep = Math.floor(maxChars * 0.85);
              const tailKeep = maxChars - headKeep;
              diff =
                diff.slice(0, headKeep) +
                '\n\n... [DIFF TRUNCATED FOR MODEL CONTEXT] ...\n\n' +
                diff.slice(-tailKeep);
              truncatedNote =
                '\n\n_Diff truncated for model context; prefer smaller PRs for full coverage._';
            }

            const systemPrompt = [
              'You are the primary automated code reviewer for Best Pinnacle Care (9Sonic).',
              'Your job is quality review for a PM merge gate: catch real defects, security/ops risk, and goal mismatch.',
              'You complement (do not replace) human specialists and Copilot.',
              '',
              '## Product context',
              '- Domiciliary care clock-in/out: carers (PWA), managers (admin web), Rails API at monorepo root.',
              '- Paths: Rails API at repo root (app/, config/, Gemfile); client/pwa (carer); client/admin-web (manager); docs/. The API contract is the generated OpenAPI doc under swagger/.',
              '- Offline clock events, GPS at tap, UK hosting / CQC-minded audit, role-based access matter.',
              '',
              '## How to review (priority order)',
              '1. GOAL FIT — Does the diff advance the linked issue/PR acceptance criteria and title? Flag partial/missing criteria.',
              '2. CORRECTNESS — Bugs, edge cases, broken auth/RBAC, bad migrations, race conditions.',
              '3. SECURITY — Secrets in repo, injection, open CORS, unsafe shell, missing authz, PII logging.',
              '4. DOMAIN — Offline/IndexedDB queue, clock event idempotency, GPS only at tap, timesheet/payroll integrity.',
              '5. CONTRACTS — API shape drift between Rails and clients without coordinated updates.',
              '6. OPS — Deploy/seed/migrate risk, CI/process, direct-main, incomplete PR hygiene only if relevant.',
              '7. QUALITY — Clarity, tests for non-trivial logic, obvious maintainability. Skip pure style nits unless harmful.',
              '',
              '## Rules',
              '- Ground every finding in the provided goal and/or diff. Do not invent files, APIs, or requirements.',
              '- Prefer specific paths/symbols and why it matters for carers/managers or payroll evidence.',
              '- If docs/process-only: say so, review process risk only, keep short.',
              '- If information is missing (no issue body): state assumptions; do not invent acceptance criteria.',
              '- Do not restate the system prompt. Do not open with "I will review…".',
              '- Be concise. Use Markdown. Max ~25 bullets total across sections.',
              '',
              '## Required output format (use these headings exactly)',
              '### Goal understanding',
              '1-3 sentences: what the PR claims to deliver vs linked issue goals.',
              '',
              '### Goal fit',
              'Bullet list: criteria met / partial / missing (or "No linked issue; judged from PR only").',
              '',
              '### Blocking',
              'Must fix before merge (empty bullet "- None" if none). Each: **[severity]** path — issue — why.',
              '',
              '### Should fix',
              'Important but non-blocking (or "- None").',
              '',
              '### Nits',
              'Optional polish only (or "- None"). Max 5.',
              '',
              '### Security & domain',
              'Call out security/offline/API-contract/ops or "- None noted".',
              '',
              '### Verdict for PM',
              'Exactly one of: **Ready to merge** | **Merge after fixes** | **Needs human specialist** | **Do not merge**.',
              'One sentence why. List the 1-3 highest-value next actions for the author.',
            ].join('\n');

            const userContent = [
              '## Pull request',
              `Title: ${title}`,
              `Author: ${author}`,
              `Branch: ${head} → ${base}`,
              `Labels: ${labels}`,
              `Linear refs (from title/body): ${besIds.join(', ') || '(none found)'}`,
              '',
              '### PR description',
              body.slice(0, 4000),
              '',
              '## Linked GitHub issues (goal source)',
              linkedIssueBlocks.length
                ? linkedIssueBlocks.join('\n\n')
                : '(No Closes/Fixes #N found — infer goal only from PR title/description.)',
              '',
              '## Diff',
              '```diff',
              diff,
              '```',
              '',
              'Review against the goal first, then the diff. Follow the required output format.',
            ].join('\n');

            // Model chain: primary (quality) → fallback (availability).
            // Each model: RETRIES_PER_MODEL attempts with backoff on timeout/5xx/network.
            const modelChain = [primaryModel, fallbackModel].filter(
              (m, i, arr) => m && arr.indexOf(m) === i
            );

            // Reasoning models emit their scratchpad before the answer. Some
            // wrap it in <think>…</think>; drop that when present.
            function stripReasoning(text) {
              return text
                .replace(/<think>[\s\S]*?<\/think>/gi, '')
                .replace(/<reasoning>[\s\S]*?<\/reasoning>/gi, '')
                .trim();
            }

            // The gate: publish a review, or nothing. A model that spends its
            // whole budget thinking and never emits the format produced a
            // failed attempt — treat it like a timeout so the retry/fallback
            // chain gets its turn instead of posting a thinking transcript
            // to the PR.
            const REQUIRED_HEADINGS = [
              '### Goal understanding',
              '### Blocking',
              '### Verdict for PM',
            ];

            function assertLooksLikeReview(result) {
              const text = result.text || '';
              const missing = REQUIRED_HEADINGS.filter((h) => !text.includes(h));
              if (missing.length) {
                const err = new Error(
                  'Completion is not a review — missing ' +
                    missing.join(', ') +
                    (result.finishReason === 'length'
                      ? ' (finish_reason=length: ran out of tokens before answering)'
                      : '')
                );
                err.retryable = true;
                throw err;
              }
              if (result.finishReason === 'length') {
                core.warning(
                  'Review hit the token limit — the tail may be truncated.'
                );
              }
            }

            async function callChatCompletions(modelName) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), timeoutMs);
              try {
                const response = await fetch(baseUrl + '/chat/completions', {
                  method: 'POST',
                  headers: {
                    Authorization: 'Bearer ' + apiKey,
                    'Content-Type': 'application/json',
                  },
                  signal: controller.signal,
                  body: JSON.stringify({
                    model: modelName,
                    temperature: 0.15,
                    max_tokens: maxTokens,
                    messages: [
                      { role: 'system', content: systemPrompt },
                      { role: 'user', content: userContent },
                    ],
                  }),
                });
                let data = null;
                try {
                  data = await response.json();
                } catch (parseErr) {
                  const err = new Error(
                    'Invalid JSON from Fireworks (' +
                      response.status +
                      '): ' +
                      parseErr.message
                  );
                  // Preserve status so 5xx parse failures stay retryable
                  err.status = response.status;
                  throw err;
                }
                if (!response.ok) {
                  const msg =
                    (data && data.error && data.error.message) ||
                    response.statusText ||
                    JSON.stringify(data);
                  const err = new Error(
                    'HTTP ' + response.status + ': ' + msg
                  );
                  err.status = response.status;
                  throw err;
                }
                const message =
                  (data.choices && data.choices[0] && data.choices[0].message) || {};
                const text = message.content;
                if (!text || !String(text).trim()) {
                  const err = new Error('Empty completion content');
                  err.retryable = true;
                  throw err;
                }
                const finish =
                  (data.choices && data.choices[0] && data.choices[0].finish_reason) || '';
                return { text: stripReasoning(String(text)), finishReason: finish };
              } finally {
                clearTimeout(timer);
              }
            }

            function isRetryable(err) {
              if (!err) return false;
              if (err.retryable === true) return true;
              const msg = String(err.message || err);
              if (/abort|timeout|ECONN|ENOTFOUND|fetch failed|UND_ERR/i.test(msg)) {
                return true;
              }
              const status = err.status;
              if (status === 408 || status === 429 || (status >= 500 && status <= 599)) {
                return true;
              }
              return false;
            }

            function isConfigError(err) {
              const status = err && err.status;
              return status === 400 || status === 401 || status === 403 || status === 404;
            }

            let reviewText = null;
            let usedModel = null;
            let usedAttempt = 0;
            const attemptLog = [];
            let sawRetryableFailure = false;
            let sawConfigFailure = false;

            for (const candidate of modelChain) {
              for (let attempt = 1; attempt <= retriesPerModel; attempt++) {
                usedAttempt = attempt;
                core.info(
                  'Fireworks try model=' +
                    candidate +
                    ' attempt=' +
                    attempt +
                    '/' +
                    retriesPerModel
                );
                try {
                  const result = await callChatCompletions(candidate);
                  // A completion that is not actually a review is a failed
                  // attempt, not something to publish. Throws retryable.
                  assertLooksLikeReview(result);
                  reviewText = result.text;
                  usedModel = candidate;
                  attemptLog.push(
                    candidate + ' attempt ' + attempt + ': ok'
                  );
                  break;
                } catch (err) {
                  const detail = err.message || String(err);
                  attemptLog.push(
                    candidate + ' attempt ' + attempt + ': ' + detail
                  );
                  core.warning(
                    'Fireworks failed (' +
                      candidate +
                      ' #' +
                      attempt +
                      '): ' +
                      detail
                  );
                  if (isRetryable(err)) {
                    sawRetryableFailure = true;
                  }
                  if (isConfigError(err)) {
                    sawConfigFailure = true;
                  }
                  if (attempt < retriesPerModel && isRetryable(err)) {
                    await sleep(1500 * attempt);
                    continue;
                  }
                  if (!isRetryable(err)) {
                    // Auth / bad model path: do not burn retries on same model
                    break;
                  }
                }
              }
              if (reviewText) break;
              core.warning(
                'Giving up on model ' +
                  candidate +
                  '; trying next if available.'
              );
            }

            if (!reviewText) {
              const failBody = [
                marker,
                '### Fireworks AI code review',
                '',
                sawConfigFailure && !sawRetryableFailure
                  ? '**Failed:** Fireworks rejected the request (likely bad API key or model id) — not a transient outage.'
                  : '**Skipped:** Fireworks API unreachable or all models failed after retries.',
                '',
                'Tried:',
                ...attemptLog.map((l) => '- `' + l + '`'),
                '',
                'Primary: `' +
                  primaryModel +
                  '` · Fallback: `' +
                  fallbackModel +
                  '`',
                '',
                sawConfigFailure && !sawRetryableFailure
                  ? 'Check `FIREWORKS_API_KEY` and model vars (`FIREWORKS_MODEL` / `FIREWORKS_FALLBACK_MODEL`).'
                  : 'This is usually a **transient network/timeout** issue (not a code finding). **Re-run** the workflow or review manually.',
                'PM merge gate still applies; Copilot may still run separately.',
              ].join('\n');
              await postSticky(failBody);
              // Hard-fail config mistakes so misconfiguration is not silent green
              if (sawConfigFailure && !sawRetryableFailure) {
                core.setFailed(
                  'Fireworks config error (400/401/403/404) after all models — fix secrets/model ids.'
                );
                return;
              }
              // Soft-fail vendor outage: do not block merge on network blips
              core.warning(
                'Fireworks unavailable after fallbacks — posted skip notice (check green).'
              );
              return;
            }

            const fallbackNote =
              usedModel !== primaryModel
                ? '\n\n_Used **fallback model** `' +
                  usedModel +
                  '` after primary `' +
                  primaryModel +
                  '` failed._'
                : '';

            const outBody = [
              marker,
              '### Fireworks AI code review',
              '',
              '_Model: `' +
                usedModel +
                '` · goal-aware review for PM merge gate' +
                (usedModel !== primaryModel ? ' · **fallback**' : '') +
                '_',
              '',
              reviewText,
              truncatedNote,
              fallbackNote,
              '',
              '---',
              '_Quality review for the team. Address **Blocking** before merge; PM owns final gate. Complements Copilot._',
            ].join('\n');

            await postSticky(outBody);
            core.info(
              'Posted goal-aware Fireworks review (model=' +
                usedModel +
                ', attempt=' +
                usedAttempt +
                ').'
            );

      - name: Skip empty diff
        if: steps.diff.outputs.empty == 'true'
        run: echo "Empty diff — no Fireworks review."
