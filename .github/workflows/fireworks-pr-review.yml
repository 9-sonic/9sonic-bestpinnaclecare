name: Fireworks AI Code Review

# AI review via Fireworks (OpenAI-compatible API). Complements Copilot —
# does not replace the PM gate or Template gate.
#
# Secret required: FIREWORKS_API_KEY (repo Settings → Secrets → Actions)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Fireworks review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr diff "${{ github.event.pull_request.number }}" > pr_diff.txt || true
          # Fallback if gh pr diff fails
          if [ ! -s pr_diff.txt ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            git diff "origin/${{ github.base_ref }}...HEAD" > pr_diff.txt || true
          fi
          BYTES=$(wc -c < pr_diff.txt | tr -d ' ')
          echo "diff_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          if [ "${BYTES:-0}" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review with Fireworks AI
        if: steps.diff.outputs.empty != 'true'
        uses: actions/github-script@v7
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          # Fireworks model path (override via repo variable FIREWORKS_MODEL if needed)
          MODEL_NAME: ${{ vars.FIREWORKS_MODEL || 'accounts/fireworks/models/kimi-k2p7-code' }}
          FIREWORKS_BASE_URL: https://api.fireworks.ai/inference/v1
          MAX_DIFF_CHARS: "24000"
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.FIREWORKS_API_KEY;
            if (!apiKey) {
              const marker = '<!-- fireworks-ai-review-bot -->';
              const body = [
                marker,
                '### Fireworks AI code review',
                '',
                'Skipped: repository secret **`FIREWORKS_API_KEY`** is not set.',
                'Add it under **Settings → Secrets and variables → Actions**, then push or re-run this workflow.',
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              }).catch(() => {});
              core.warning(
                'Missing FIREWORKS_API_KEY — review skipped (not failing the PR).'
              );
              return;
            }

            const model = process.env.MODEL_NAME;
            const baseUrl = process.env.FIREWORKS_BASE_URL.replace(/\/$/, '');
            const maxChars = parseInt(process.env.MAX_DIFF_CHARS || '24000', 10);

            let diff = fs.readFileSync('pr_diff.txt', 'utf8');
            if (!diff || !diff.trim()) {
              core.info('Empty diff, skipping.');
              return;
            }

            let truncatedNote = '';
            if (diff.length > maxChars) {
              diff = diff.slice(0, maxChars);
              truncatedNote =
                '\n\n_Diff truncated for model context limits; large PRs may need a split review._';
            }

            const systemPrompt = [
              'You are a senior software engineer reviewing a pull request for Best Pinnacle Care',
              '(9Sonic monorepo: /pwa carer app, /admin-web manager app, /backend Rails, /contracts shared API shapes, /docs).',
              'Focus on: bugs, security (secrets, auth, injection), offline/clock-in risk, contract drift between packages,',
              'error handling, and operational impact for carers/managers.',
              'Be concise and actionable. Use Markdown with short bullet lists.',
              'If the change is docs/process only, say so briefly and note any process risks.',
              'Do not invent files that are not in the diff.',
            ].join(' ');

            const userContent =
              'Review this pull request diff:\n\n```diff\n' + diff + '\n```';

            const response = await fetch(baseUrl + '/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + apiKey,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model,
                temperature: 0.2,
                max_tokens: 2048,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userContent },
                ],
              }),
            });

            const data = await response.json();
            if (!response.ok) {
              const msg =
                (data && data.error && data.error.message) ||
                response.statusText ||
                JSON.stringify(data);
              core.setFailed('Fireworks API error: ' + msg);
              return;
            }

            const reviewText =
              data.choices &&
              data.choices[0] &&
              data.choices[0].message &&
              data.choices[0].message.content;
            if (!reviewText) {
              core.setFailed('Fireworks returned an empty review.');
              return;
            }

            const marker = '<!-- fireworks-ai-review-bot -->';
            const body = [
              marker,
              '### Fireworks AI code review',
              '',
              '_Model: `' + model + '`_',
              '',
              reviewText.trim(),
              truncatedNote,
              '',
              '---',
              '_Automated review for the team. Address real issues; PM still owns the merge gate. Complements Copilot._',
            ].join('\n');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) =>
                c.user &&
                c.user.type === 'Bot' &&
                (c.body || '').includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated existing Fireworks review comment.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info('Posted Fireworks review comment.');
            }

      - name: Skip empty diff
        if: steps.diff.outputs.empty == 'true'
        run: echo "Empty diff — no Fireworks review."
