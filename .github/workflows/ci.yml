name: CI

# Layout is load-bearing: Rails 8 API lives at the repository root, frontends
# live under client/. Any new top-level directory must be reflected here, in
# .github/labeler.yml, and in .github/workflows/deploy.yml — see CONTRIBUTING.md.
# The API contract is the OpenAPI/Swagger doc (swagger/, served at /api-docs) —
# there is no separate contracts/ directory.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pwa:
              - 'client/pwa/**'
            admin_web:
              - 'client/admin-web/**'
            backend:
              - 'app/**'
              - 'config/**'
              - 'db/**'
              - 'lib/**'
              - 'spec/**'
              - 'swagger/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'Rakefile'
              - 'config.ru'
              - '.ruby-version'
              - '.rubocop.yml'
              - '.rspec'

  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required monorepo paths
        run: |
          set -euo pipefail
          # Rails at repo root; frontends under client/
          for d in client/pwa client/admin-web docs .github app config; do
            test -d "$d" || { echo "Missing required directory: $d"; exit 1; }
          done
          test -f Gemfile || { echo "Missing Gemfile (Rails API root)"; exit 1; }
          echo "Monorepo layout OK"
      - name: Block stray top-level app directories
        run: |
          set -euo pipefail
          # The pre-Rails sketch had backend/, pwa/ and admin-web/ at the root.
          # Both shapes coexisting is what broke CI — keep exactly one.
          fail=0
          for d in backend pwa admin-web frontend; do
            if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
              echo "Top-level ${d}/ is not the layout: Rails lives at the root, frontends under client/"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "No stray top-level app directories"
      - name: Block committed build output
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(dist|dev-dist|build|node_modules)/'; then
            echo "Build output must not be committed — add it to .gitignore"
            exit 1
          fi
          echo "No committed build output"
      - name: Block committed env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Committed .env files are not allowed"
            exit 1
          fi
          echo "No committed .env files"

  backend:
    name: backend (Rails)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestpinnacle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bestpinnacle_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pg build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          # Version comes from .ruby-version
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Lint (RuboCop)
        run: bin/rubocop --parallel

      # Full report, always visible in the log, never blocks.
      - name: Security report (Brakeman)
        run: bin/brakeman --no-pager --no-exit-on-warn

      # Blocks on high-confidence findings only. Medium/weak ones are
      # heuristics that need a human call (e.g. an admin-only endpoint that
      # legitimately permits :role) — they belong in review, not in a red X
      # that everyone learns to ignore. Raise this to -w2 once the medium
      # findings have been triaged.
      - name: Security gate (Brakeman, high confidence)
        run: bin/brakeman --no-pager -w3 -q

      - name: Specs (RSpec)
        run: bundle exec rspec

      # Advisory only: a newly published CVE should surface, not block an
      # unrelated PR. Promote to blocking once someone owns triage.
      - name: Dependency audit (bundler-audit)
        continue-on-error: true
        run: bin/bundler-audit check --update

  client-pwa:
    name: client/pwa
    needs: detect-changes
    if: needs.detect-changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & verify
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json in client/pwa yet — scaffold pass"
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
            pnpm run lint --if-present
            pnpm run typecheck --if-present
            pnpm run build --if-present
            pnpm run test --if-present
          elif [ -f yarn.lock ]; then
            corepack enable && corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile
            yarn run lint
            yarn run typecheck
            yarn run build
            yarn run test
          else
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run lint --if-present
            npm run typecheck --if-present
            npm run build --if-present
            npm run test --if-present
          fi

  client-admin-web:
    name: client/admin-web
    needs: detect-changes
    if: needs.detect-changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & verify
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json in client/admin-web yet — scaffold pass"
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
            pnpm run lint --if-present
            pnpm run typecheck --if-present
            pnpm run build --if-present
            pnpm run test --if-present
          elif [ -f yarn.lock ]; then
            corepack enable && corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile
            yarn run lint
            yarn run typecheck
            yarn run build
            yarn run test
          else
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run lint --if-present
            npm run typecheck --if-present
            npm run build --if-present
            npm run test --if-present
          fi

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - detect-changes
      - repo-hygiene
      - backend
      - client-pwa
      - client-admin-web
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          set -euo pipefail
          echo "detect-changes:   ${{ needs.detect-changes.result }}"
          echo "repo-hygiene:     ${{ needs.repo-hygiene.result }}"
          echo "backend:          ${{ needs.backend.result }}"
          echo "client-pwa:       ${{ needs.client-pwa.result }}"
          echo "client-admin-web: ${{ needs.client-admin-web.result }}"

          fail=0

          # Always-on jobs must succeed outright.
          for r in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.repo-hygiene.result }}"
          do
            if [ "$r" != "success" ]; then fail=1; fi
          done

          # Path-scoped jobs: success or skipped are both fine; anything else is not.
          for r in \
            "${{ needs.backend.result }}" \
            "${{ needs.client-pwa.result }}" \
            "${{ needs.client-admin-web.result }}"
          do
            case "$r" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "CI summary: FAILED"
            exit 1
          fi
          echo "CI summary: OK"

      # Trunk is broken — tell #bpc-alerts. PR failures are the author's
      # business and stay out of Slack. `secrets` is not available in `if:`,
      # so the webhook check lives inside the step.
      - name: Notify Slack that main is broken
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No Slack webhook configured — skipping (see docs/slack-setup.md)."
            exit 0
          fi
          payload=$(jq -n \
            --arg commit "$COMMIT_URL" \
            --arg run "$RUN_URL" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            '{
              text: "🚨 CI failed on main",
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: "🚨 CI failed on main", emoji: true } },
                { type: "section",
                  text: { type: "mrkdwn",
                          text: ("*Commit:* <" + $commit + "|" + $sha + "> by " + $actor
                                 + "\n*Run:* <" + $run + "|CI details>") } }
              ]
            }')
          curl -sS --fail-with-body -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
