# Path → label mapping for actions/labeler
# Labels must already exist on the repository.
#
# Layout: Rails 8 API at the repository root, frontends under client/.
# Keep in sync with .github/workflows/ci.yml and .github/workflows/deploy.yml.

scope:pwa:
  - changed-files:
      - any-glob-to-any-file:
          - "client/pwa/**"

scope:admin-web:
  - changed-files:
      - any-glob-to-any-file:
          - "client/admin-web/**"

scope:backend:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "config/**"
          - "db/**"
          - "lib/**"
          - "spec/**"
          - "swagger/**"
          - "Gemfile"
          - "Gemfile.lock"
          - "Rakefile"
          - "config.ru"
          - "deploy/**"

scope:contracts:
  - changed-files:
      - any-glob-to-any-file: "contracts/**"

scope:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - ".github/**"
          - ".claude/**"
          - "README.md"
          - "CONTRIBUTING.md"
