# Path → label mapping for actions/labeler
# Labels must already exist on the repository.

scope:pwa:
  - changed-files:
      - any-glob-to-any-file:
          - "client/pwa/**"
          - "pwa/**"

scope:admin-web:
  - changed-files:
      - any-glob-to-any-file:
          - "client/admin-web/**"
          - "admin-web/**"

scope:backend:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "config/**"
          - "db/**"
          - "spec/**"
          - "Gemfile"
          - "Gemfile.lock"
          - "backend/**"
          - "deploy/**"

scope:contracts:
  - changed-files:
      - any-glob-to-any-file: "contracts/**"

scope:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - ".github/**"
          - ".claude/**"
          - "README.md"
          - "CONTRIBUTING.md"
